# e1MinoBSD live system configuration (read-only CD root)
hostname="e1minobsd"

# Writable memory filesystems over the read-only root
tmpmfs="YES"
tmpsize="512m"
varmfs="YES"
varsize="256m"

# Network: DHCP on the default interface
ifconfig_DEFAULT="DHCP"
background_dhclient="YES"

# Services
syslogd_enable="YES"
sendmail_enable="NONE"
sendmail_submit_enable="NO"
sendmail_outbound_enable="NO"
sendmail_msp_queue_enable="NO"
sshd_enable="NO"
